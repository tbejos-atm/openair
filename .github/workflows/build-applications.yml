name: Build OpenAir Applications

# This workflow provides build coverage for OpenAir applications
# It installs the Zephyr SDK and drives builds with twister.
#
# Builds are grouped one job per application directory.
#
# Two passes are made per application, split on the 'mcuboot' tag, because the
# mcuboot scenarios require the '@mcuboot' board revision:
#   - normal revisions:  -e mcuboot
#   - @mcuboot revisions: -t mcuboot
#
# This workflow is build coverage only - it does not save artifacts other than
# logs or create releases.
# Release archives are produced by build-release-archives.yml.

on:
  pull_request:
    branches:
      - 'rel_*'
      - 'pre_rel_*'
  push:
    branches:
      - 'rel_*'
      - 'pre_rel_*'
  workflow_dispatch:

env:
  # Test scenarios to skip, one fnmatch glob per line. Blank lines and lines
  # starting with '#' are ignored. Matched against the test scenario name,
  # e.g. 'samples.hello_world.atm' or 'tests.drivers.pwm.*'. These are
  # translated into a twister quarantine list.
  SCENARIO_BLACKLIST: |
    # tests.example.scenario.to.skip
    # tests.drivers.some_subsystem.*
    tests.subsys.dfu.mcuboot_multi.atm.mcuboot.*

jobs:
  discover-applications:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      platforms_normal: ${{ steps.set-matrix.outputs.platforms_normal }}
      platforms_mcuboot: ${{ steps.set-matrix.outputs.platforms_mcuboot }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip3 install --user PyYAML

      - name: Discover applications and platforms
        id: set-matrix
        run: |
          python3 << 'EOF'
          import os
          import yaml
          import json
          import fnmatch

          # Parse the scenario blacklist from the workflow environment
          blacklist = []
          for line in os.environ.get('SCENARIO_BLACKLIST', '').splitlines():
              line = line.strip()
              if line and not line.startswith('#'):
                  blacklist.append(line)

          if blacklist:
              print(f"Scenario blacklist ({len(blacklist)} patterns):")
              for pattern in blacklist:
                  print(f"  - {pattern}")

          def is_blacklisted(test_name):
              return any(fnmatch.fnmatch(test_name, pattern) for pattern in blacklist)

          # Discover twister platform identifiers from the board yaml files under
          # boards/atmosic. These carry the fully qualified identifier that
          # twister's -p expects, e.g. 'ATMEVK-3330-QN-6/ATM33xx-5', along with
          # the 'supported:' feature list that twister matches depends_on
          # against. board.yml and runner_config.yml have no 'identifier' and
          # are skipped.
          platforms_normal = []
          platforms_mcuboot = []
          boards_dir = 'boards/atmosic'

          for root, dirs, files in os.walk(boards_dir):
              dirs[:] = [d for d in dirs]

              for name in files:
                  if not name.endswith(('.yaml', '.yml')):
                      continue
                  path = os.path.join(root, name)
                  try:
                      data = yaml.safe_load(open(path))
                  except Exception as e:
                      print(f"Warning: Failed to parse {path}: {e}")
                      continue
                  if not isinstance(data, dict) or 'identifier' not in data:
                      continue
                  identifier = data['identifier']
                  if '@mcuboot' in identifier:
                      platforms_mcuboot.append(identifier)
                  else:
                      platforms_normal.append(identifier)

          platforms_normal.sort()
          platforms_mcuboot.sort()
          print(f"Discovered {len(platforms_normal)} normal platforms:")
          for p in platforms_normal:
              print(f"  - {p}")
          print(f"Discovered {len(platforms_mcuboot)} @mcuboot platforms:")
          for p in platforms_mcuboot:
              print(f"  - {p}")

          # Find all application directories with a sample.yaml or testcase.yaml.
          # Which scenario builds on which platform is left to twister; this only
          # decides how the work is split across matrix jobs. An app is dropped
          # when every one of its scenarios is blacklisted.
          app_dirs = []

          for root, dirs, files in os.walk('.'):
              for yaml_file in ['sample.yaml', 'testcase.yaml']:
                  if yaml_file not in files:
                      continue
                  yaml_path = os.path.join(root, yaml_file)
                  app_dir = root[2:]  # Remove leading './'

                  try:
                      data = yaml.safe_load(open(yaml_path))
                  except Exception as e:
                      print(f"Warning: Failed to parse {yaml_path}: {e}")
                      continue
                  if not data or 'tests' not in data:
                      continue

                  scenarios = list(data['tests'].keys())
                  kept = [s for s in scenarios if not is_blacklisted(s)]
                  if not kept:
                      print(f"Skipping {app_dir}: all {len(scenarios)} scenarios blacklisted")
                      continue
                  app_dirs.append(app_dir)

          app_dirs = sorted(set(app_dirs))
          print(f"Found {len(app_dirs)} application directories")

          matrix = {'include': [{'app_dir': d} for d in app_dirs]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"platforms_normal={' '.join(platforms_normal)}\n")
              f.write(f"platforms_mcuboot={' '.join(platforms_mcuboot)}\n")
          EOF

  prepare:
    # Populates the Zephyr SDK and west module caches before the build matrix
    # fans out. Without this, every matrix job starts on a cold cache, downloads
    # the SDK independently, and all but one of the resulting cache writes is
    # discarded - a cache entry is only published when the job that created it
    # finishes, so concurrent jobs cannot share one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: openair

      - name: Set up Python environment
        run: |
          python3 -m pip install --user -U pip
          python3 -m pip install --user west

      - name: Check Zephyr SDK cache
        id: cache-zephyr-sdk
        uses: actions/cache/restore@v4
        with:
          path: ~/zephyr-sdk-1.0.1
          key: ${{ runner.os }}-zephyr-sdk-1.0.1
          # Only test for the entry - the matrix jobs do the actual restore
          lookup-only: true

      - name: Install Zephyr SDK
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          cd ~
          # Using Zephyr SDK 1.0.1 which is compatible with Zephyr-based projects
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz
          wget -O - https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/sha256.sum | shasum --check --ignore-missing
          tar xvf zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz
          cd zephyr-sdk-1.0.1
          ./setup.sh -t arm-zephyr-eabi

      - name: Save Zephyr SDK cache
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/zephyr-sdk-1.0.1
          key: ${{ runner.os }}-zephyr-sdk-1.0.1

      - name: Check West modules cache
        id: cache-west-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/.west
          key: ${{ runner.os }}-west-modules-${{ hashFiles('openair/west.yml') }}
          lookup-only: true

      - name: Restore closest West modules cache
        if: steps.cache-west-modules.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/.west
          key: ${{ runner.os }}-west-modules-${{ hashFiles('openair/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-modules-

      - name: Initialize West workspace
        if: steps.cache-west-modules.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}
          # If .west directory exists from cache, remove it to reinitialize
          if [ -d .west ]; then
            rm -rf .west
          fi
          west init -l openair
          west update

      - name: Save West modules cache
        if: steps.cache-west-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/.west
          key: ${{ runner.os }}-west-modules-${{ hashFiles('openair/west.yml') }}

  build:
    needs: [discover-applications, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-applications.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: openair

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev \
            libmagic1

      - name: Set up Python environment
        run: |
          python3 -m pip install --user -U pip
          python3 -m pip install --user west

      - name: Cache Zephyr SDK
        id: cache-zephyr-sdk
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-1.0.1
          key: ${{ runner.os }}-zephyr-sdk-1.0.1

      - name: Install Zephyr SDK
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          cd ~
          # Using Zephyr SDK 1.0.1 which is compatible with Zephyr-based projects
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz
          wget -O - https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/sha256.sum | shasum --check --ignore-missing
          tar xvf zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz
          cd zephyr-sdk-1.0.1
          ./setup.sh -t arm-zephyr-eabi

      - name: Cache West modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/.west
          key: ${{ runner.os }}-west-modules-${{ hashFiles('openair/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-modules-

      - name: Initialize West workspace
        run: |
          cd ${{ github.workspace }}
          # If .west directory exists from cache, remove it to reinitialize
          if [ -d .west ]; then
            rm -rf .west
          fi
          west init -l openair
          west update
          west zephyr-export

      - name: Install Python dependencies
        run: |
          pip3 install --user -r ${{ github.workspace }}/zephyr/scripts/requirements.txt
          pip3 install --user -r ${{ github.workspace }}/openair/scripts/requirements.txt

      - name: Generate quarantine list
        id: quarantine
        run: |
          python3 << 'EOF'
          import fnmatch
          import json
          import os

          # Twister has no scenario-exclude flag, so the blacklist is expressed
          # as a quarantine list. Quarantine entries match with re.fullmatch, so
          # the fnmatch globs are translated to equivalent regexes. JSON is valid
          # YAML, so the file is emitted as JSON to avoid needing PyYAML here.
          patterns = []
          for line in os.environ.get('SCENARIO_BLACKLIST', '').splitlines():
              line = line.strip()
              if line and not line.startswith('#'):
                  patterns.append(line)

          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'quarantine.yaml')
          if patterns:
              entries = [{
                  'scenarios': [fnmatch.translate(p).removeprefix('(?s:').removesuffix(')\\Z')
                                for p in patterns],
                  'comment': 'Blacklisted via SCENARIO_BLACKLIST in build-applications.yml',
              }]
              with open(path, 'w') as f:
                  json.dump(entries, f, indent=2)
              print(f"Quarantining {len(patterns)} scenario patterns:")
              for p in patterns:
                  print(f"  - {p}")
          else:
              path = ''
              print("No scenario blacklist configured")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"path={path}\n")
          EOF

      - name: Build all configurations for ${{ matrix.app_dir }}
        id: build
        env:
          PLATFORMS_NORMAL: ${{ needs.discover-applications.outputs.platforms_normal }}
          PLATFORMS_MCUBOOT: ${{ needs.discover-applications.outputs.platforms_mcuboot }}
          QUARANTINE_LIST: ${{ steps.quarantine.outputs.path }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import subprocess

          app_dir = '${{ matrix.app_dir }}'
          workspace = '${{ github.workspace }}'

          def platform_args(var):
              args = []
              for p in os.environ.get(var, '').split():
                  args += ['-p', p]
              return args

          quarantine = os.environ.get('QUARANTINE_LIST', '')
          quarantine_args = ['--quarantine-list', quarantine] if quarantine else []

          # The mcuboot scenarios need the '@mcuboot' board revision, so they are
          # built in a separate pass against the '@mcuboot' platform identifiers.
          # Twister ORs multiple -t values, hence the split rather than one call.
          passes = [
              ('normal', platform_args('PLATFORMS_NORMAL'), ['-e', 'mcuboot'],
               'twister-normal'),
              ('mcuboot', platform_args('PLATFORMS_MCUBOOT'), ['-t', 'mcuboot'],
               'twister-mcuboot'),
          ]

          selected_count = 0
          fail_count = 0

          for label, plat_args, tag_args, out_dir in passes:
              if not plat_args:
                  print(f"⚠️  No platforms discovered for the {label} pass, skipping")
                  continue

              cmd = [
                  'west', 'twister',
                  '-T', f'openair/{app_dir}',
                  *plat_args,
                  *tag_args,
                  *quarantine_args,
                  '--build-only',
                  '-O', out_dir,
                  '-v', '--inline-logs',
              ]

              print(f"\n{'='*80}")
              print(f"Running ({label}): {' '.join(cmd)}")
              print(f"{'='*80}\n")

              # Twister exits non-zero when any instance fails; failures are
              # evaluated from the report instead so partial failures are visible.
              # '--inline-logs' makes twister dump build.log to stdout for every
              # failing instance, so failures are diagnosable from the job log.
              result = subprocess.run(cmd, cwd=workspace, check=False)
              print(f"\ntwister ({label}) exited with {result.returncode}")

              report_path = os.path.join(workspace, out_dir, 'twister.json')
              if not os.path.isfile(report_path):
                  # Also the normal outcome when no scenario in this app carries
                  # the tag for this pass - twister then finds nothing to do and
                  # exits without writing a report.
                  print(f"⚠️  No twister.json produced for the {label} pass")
                  continue

              with open(report_path, 'r') as f:
                  report = json.load(f)

              # 'filtered' instances were pruned by twister from the scenario
              # metadata - depends_on, platform_allow and friends - or by the
              # quarantine list, and are not build failures.
              for suite in report.get('testsuites', []):
                  status = suite.get('status')
                  if status == 'filtered':
                      continue
                  selected_count += 1
                  if status in ('error', 'failed'):
                      fail_count += 1
                      print(f"❌ {suite.get('name')} on {suite.get('platform')}: "
                            f"{suite.get('reason', 'unknown')}")

          success_count = selected_count - fail_count

          print(f"\n{'='*80}")
          print(f"Build Summary: {success_count} succeeded, "
                f"{fail_count} failed, {selected_count} selected")
          print(f"{'='*80}\n")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"selected_count={selected_count}\n")
              f.write(f"success_count={success_count}\n")
              f.write(f"fail_count={fail_count}\n")

          # Exit with error only if every selected build failed
          if selected_count > 0 and success_count == 0:
              exit(1)
          EOF

      - name: Collect logs on failure
        id: logs
        # Runs when the step failed outright or when any individual build failed.
        # Twister already inlines each failing build.log into the job log; this
        # additionally packages the logs so they can be downloaded and grepped.
        if: always() && steps.build.outcome != 'skipped' &&
            (steps.build.outcome != 'success' || steps.build.outputs.fail_count != '0')
        run: |
          cd ${{ github.workspace }}
          # Log files and reports only - the build trees themselves are large
          # and not useful for diagnosis.
          find twister-normal twister-mcuboot \
            \( -name '*.log' -o -name 'twister.json' -o -name 'twister.xml' \) \
            -print0 2>/dev/null \
            | tar --null --files-from=- -czf build-logs.tar.gz || true

          if [ -s build-logs.tar.gz ]; then
            echo "name=build-logs-$(echo '${{ matrix.app_dir }}' | tr '/' '-')" >> $GITHUB_OUTPUT
            echo "has_logs=true" >> $GITHUB_OUTPUT
          else
            echo "No log files were produced"
            echo "has_logs=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload logs on failure
        if: always() && steps.logs.outputs.has_logs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.logs.outputs.name }}
          path: ${{ github.workspace }}/build-logs.tar.gz
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary: ${{ matrix.app_dir }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:** \`${{ matrix.app_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Selected builds:** ${{ steps.build.outputs.selected_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Succeeded:** ${{ steps.build.outputs.success_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Failed:** ${{ steps.build.outputs.fail_count }}" >> $GITHUB_STEP_SUMMARY

